name: Build and Release AnymeX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  build-and-release:
    name: Build & Release AnymeX APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | cut -d '+' -f 2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Version extracted: $VERSION+$BUILD_NUMBER"

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/anymex.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=anymex.jks\n" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi

      - name: Setup Environment File (.env)
        env:
          AL_CLIENT_ID: ${{ secrets.AL_CLIENT_ID }}
          AL_CLIENT_SECRET: ${{ secrets.AL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          CALLBACK_SCHEME: ${{ secrets.CALLBACK_SCHEME }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GIT_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
          GIT_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}
          GIT_CALLBACK_SCHEME: ${{ secrets.GIT_CALLBACK_SCHEME }}
          COMMENTS_BASE_URL: ${{ secrets.COMMENTS_BASE_URL }}
          BOT_BASE_URL: ${{ secrets.BOT_BASE_URL }}
          BOT_API_SECRET: ${{ secrets.BOT_API_SECRET }}
        run: |
          cat > .env << EOF
          AL_CLIENT_ID=$AL_CLIENT_ID
          AL_CLIENT_SECRET=$AL_CLIENT_SECRET
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          CALLBACK_SCHEME=$CALLBACK_SCHEME
          GOOGLE_BOOKS_API_KEY=$GOOGLE_BOOKS_API_KEY
          GIT_CLIENT_ID=$GIT_CLIENT_ID
          GIT_CLIENT_SECRET=$GIT_CLIENT_SECRET
          GIT_CALLBACK_SCHEME=$GIT_CALLBACK_SCHEME
          COMMENTS_BASE_URL=$COMMENTS_BASE_URL
          BOT_BASE_URL=$BOT_BASE_URL
          BOT_API_SECRET=$BOT_API_SECRET
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze Gate
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Split-ABI Release APKs
        run: |
          flutter build apk --split-per-abi --release
          cd build/app/outputs/flutter-apk
          cp app-armeabi-v7a-release.apk AnymeX_v${{ env.VERSION }}_armeabi-v7a-release.apk
          cp app-arm64-v8a-release.apk AnymeX_v${{ env.VERSION }}_arm64-v8a-release.apk
          cp app-x86_64-release.apk AnymeX_v${{ env.VERSION }}_x86_64-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnymeX-APKs-v${{ env.VERSION }}
          path: build/app/outputs/flutter-apk/AnymeX_v*_release.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: AnymeX v${{ env.VERSION }}
          body: |
            ## AnymeX v${{ env.VERSION }} Release
            Automated build under **ifritraen** identity.
          files: |
            build/app/outputs/flutter-apk/AnymeX_v${{ env.VERSION }}_armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/AnymeX_v${{ env.VERSION }}_arm64-v8a-release.apk
            build/app/outputs/flutter-apk/AnymeX_v${{ env.VERSION }}_x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
